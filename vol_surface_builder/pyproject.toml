[project]
name = "vollib"
version = "0.1.0"
description = "Construcción de superficies de volatilidad FX (Módulo 2) — replica la metodología de Calypso"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
