[project]
name = "curve-bootstrapper"
version = "0.1.0"
description = "Motor de bootstrapping multi-curva (OIS/IBOR/XCCY) con parametrizador web"
requires-python = ">=3.14,<3.15"

# Este proyecto no se instala como paquete (server.py y examples/ usan
# sys.path.insert hacia src/ en vez de una instalación editable), así que
# no se declara [build-system]. Este archivo solo fija la versión de
# Python compatible/probada, en conjunto con .python-version.
