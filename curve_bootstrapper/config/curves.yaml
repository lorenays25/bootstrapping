# =============================================================================
# curves.yaml — Configuración de las 28 curvas del sistema
# =============================================================================
# ¡IMPORTANTE!  Todos los quotes son DATOS DE EJEMPLO (niveles plausibles pero
# ficticios) para que el sistema corra end-to-end. Reemplázalos con tu data
# de mercado real.
#
# Unidades:
#   - Tasas y basis:  DECIMAL       (3.70% -> 0.0370 ;  -15 bp -> -0.0015)
#   - Puntos forward: PUNTOS        (se dividen por points_factor)
#   - FX spots:       outright
#
# Campos por curva:
#   mode:        sequential | global
#   discount:    self | <nombre de curva>     (semántica de descuento)
#   projection:  self | <nombre de curva>     (curva de proyección de forwards)
#   other_leg:   <curva de la otra moneda>    (solo para fx_forward)
#   depends_on:  [curvas que deben construirse antes]
#   conventions: calendar, day_count, spot_lag, fixed_freq, float_freq,
#                fx_pair, solve_for, points_factor, ...
#
# Convenciones adicionales (opcionales; si se omiten usan el default que ya
# tenían las 27 curvas originales, documentado a la derecha de cada una):
#   business_day_convention: MF|F|P|NONE     (default MF)
#   end_of_month:            bool             (default false)
#   short_end_payment_style: periodic|bullet  (default: bullet en ois_swap,
#                                               periodic en el resto)
#   rate_cutoff_days:        int              (default 0, solo ois_swap)
#   pay_delay_days:          int              (default 0, ambas patas)
#   reset_position:          in_arrears|in_advance  (solo VALIDA contra el
#                                               'type'; no cambia pricing)
#   accrual_convention:      excl_spread|incl_spread (default excl_spread,
#                                               solo xccy_basis/tenor_basis)
# =============================================================================

