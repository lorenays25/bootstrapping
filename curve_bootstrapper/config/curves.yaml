      - {type: future, tenor: 21Mx24M, quote: 97.58, quote_convention: price, convexity_bp: 0.5}
      - {type: ibor_swap, tenor: 3Y,  quote: 0.0224}
      - {type: ibor_swap, tenor: 5Y,  quote: 0.0235}
      - {type: ibor_swap, tenor: 7Y,  quote: 0.0244}
