# =============================================================================
# PRESETS DE CONVENCIÓN (referenciables desde cualquier instrumento con
# `convention: <nombre>`). Evitan repetir la misma convención en cada uno de
# los bonos y dejan visible, en el diff, cuál se desvía del estándar.
# =============================================================================
conventions:

  # Soberanos peruanos en soles — familia "Calc Type 1275" de Bloomberg.
  # Day counts de pantalla DES: cupones 30/360, corrido ACT/ACT, precio
  # ACT/360. Solo los dos primeros entran al bootstrap: el 30/360 dimensiona
  # el cupón (semestral regular => cupón/2 exacto) y el ACT/ACT el corrido.
  # El ACT/360 del precio solo se usaría para calibrar contra YIELD.
  bono_soberano_pen:
    type: sovereign_bond
    coupon_freq: semiannual
    redemption: 100.0
    price_type: clean_price          # los quotes BGN son precio limpio
    daycount_accrued: ACT/ACT_ISMA
    settlement_lag: 1                # T+1: distinto del spot_lag T+2 del OIS
    business_day_convention: F       # PENDIENTE confirmar con primera línea

