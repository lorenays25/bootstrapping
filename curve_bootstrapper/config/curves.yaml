  # ===========================================================================
  # NIVEL 1 — Curvas que dependen de su RFR / domésticas
  # ===========================================================================

  USD_FEDFUNDS:
    # Construcción secuencial vía basis Fed Funds vs SOFR.
    # Incógnita: proyección EFFR. Descuento: USD_SOFR.
    # quote = spread s de la pata FF tal que FF+s = SOFR (en PV).
    mode: sequential
    discount: USD_SOFR
    projection: USD_SOFR          # pata base contra la que se mide el basis
    depends_on: [USD_SOFR]
    conventions: {calendar: US, day_count: ACT/360, spot_lag: 2, float_freq: Q}
    instruments:
      - {type: tenor_basis, tenor: 3M,  quote: -0.00050}
      - {type: tenor_basis, tenor: 6M,  quote: -0.00050}
      - {type: tenor_basis, tenor: 1Y,  quote: -0.00048}
      - {type: tenor_basis, tenor: 2Y,  quote: -0.00045}
      - {type: tenor_basis, tenor: 5Y,  quote: -0.00040}
      - {type: tenor_basis, tenor: 10Y, quote: -0.00035}

  EURIBOR_3M:
