  PEN_OIS_TIBO:
    # Tramo corto: TIBO + OIS PEN (liquidan T+2, heredado de la curva).
    # Tramo largo (>2Y): NO hay OIS PEN líquido, así que se calibra con
    # Soberanos en soles, que liquidan T+1 y traen sus propias convenciones
    # vía el preset `bono_soberano_pen`. Es el caso que motiva la resolución de
    # convenciones por instrumento.
    #
    # mode: global — el tramo largo está dominado por bonos y cada bono
    # depende de TODOS los pilares previos vía sus cupones. En secuencial,
    # los bonos con descuento profundo (2034, 2040) quedan con residual
    # ~1e-3 por tolerancia del Brent sobre el log-DF; en global cierran a
    # ~1e-14.
    #
    # ADVERTENCIA DE MODELO: al calibrar el tramo largo con soberanos, ese
    # tramo deja de ser una curva OIS pura y pasa a incorporar riesgo
    # soberano y prima de liquidez. Es práctica estándar en EM, pero la
    # curva >2Y es, en rigor, la curva de gobierno peruana.
    mode: global
    discount: self
    projection: self
    depends_on: []
    conventions: {calendar: PE, day_count: ACT/360, spot_lag: 2, fixed_freq: A}
    instruments:
      # --- ON: TIBO (PEIIEAVG). Tipo mm (depósito overnight).
      #     Para tenor ON el engine arranca en valuation_date directamente
      #     (no usa spot_lag), así que no necesita override de convención.
      - type: mm
        tenor: "ON"
        quote: {bid: 0.0425, mid: 0.0425, ask: 0.0425}

      # --- tramo corto: OIS PEN "At Maturity" (bullet, heredan fixed_freq:A
      #     de la curva; short_end_payment_style: bullet por defecto en ois_swap).
      #     Liquidan T+2 (spot_lag de la curva). Pay delay 0 en ambas patas.
      - {type: ois_swap, tenor: 3M,  quote: {bid: 0.0428, mid: 0.0430, ask: 0.0432}}
      - {type: ois_swap, tenor: 6M,  quote: {bid: 0.0430, mid: 0.0432, ask: 0.0434}}
      - {type: ois_swap, tenor: 9M,  quote: {bid: 0.0432, mid: 0.0434, ask: 0.0436}}
      - {type: ois_swap, tenor: 12M, quote: {bid: 0.0433, mid: 0.0435, ask: 0.0437}}
      # 18M también es At Maturity, pero SUPERA 1Y y ahí está el detalle: la
      # regla de bullet de ois_swap solo colapsa a pago único los tenores <=1Y
      # (`tenor_years(tenor) <= 1.0` en _fixed_schedule). Sin override, el 18M
      # hereda fixed_freq: A y paga DOS veces (verificado: 2027-01-06 y
      # 2028-01-06). Se fuerza cupón cero con fixed_freq: Z.
      - {type: ois_swap, tenor: 18M, fixed_freq: Z,
         quote: {bid: 0.0433, mid: 0.0435, ask: 0.0437}}

      # --- 24M: OIS PEN "SemiAnnual". Ambas patas con frecuencia semestral.
      #     fixed_freq: S pisa el fixed_freq: A de la curva para ESTE instrumento.
      #     Es el único OIS del tramo que no es At Maturity.
      - type: ois_swap
        tenor: 24M
        fixed_freq: S
        quote: {bid: 0.0443, mid: 0.0445, ask: 0.0447}
      # --- tramo largo: Soberanos PEN, liquidan T+1 (preset bono_soberano_pen).
      #     Quotes = precio limpio bid/mid/ask (BGN). NO son tasas: no se
      #     escalan por rate_scale al cargarlos desde hoja.
      - {convention: bono_soberano_pen, ticker: "PERUGB 5.94 02/12/29",
         maturity: 2029-02-12, coupon: 5.94,
         quote: {bid: 105.857, mid: 105.954, ask: 106.051}}
      - {convention: bono_soberano_pen, ticker: "PERUGB 6.95 08/12/31",
         maturity: 2031-08-12, coupon: 6.95,
         quote: {bid: 114.439, mid: 114.555, ask: 114.671}}
      - {convention: bono_soberano_pen, ticker: "PERUGB 6.15 08/12/32",
         maturity: 2032-08-12, coupon: 6.15,
