    # consecutivas). Parte larga: swaps desde 3Y. Día 30E/360 en la pata
    # fija confirmado en pantalla (no ACT/360 como en las OIS).
    mode: sequential
    discount: EUR_ESTR
    projection: self
    depends_on: [EUR_ESTR]
    conventions: {calendar: TARGET, day_count: 30E/360, float_day_count: ACT/360,
                  spot_lag: 2, fixed_freq: A, float_freq: Q}
    instruments:
